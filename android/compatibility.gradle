// Must be applied from settings.gradle (before projects are evaluated).
// Registers afterEvaluate early so we never hit "already evaluated" errors.

gradle.beforeProject { project ->
    if (project == project.rootProject) {
        project.ext.set("FlutterFire", [FirebaseSDKVersion: "34.12.0"])
    }

    project.afterEvaluate {
        if (!project.plugins.hasPlugin("com.android.library")) {
            return
        }

        project.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        project.tasks.withType(JavaCompile).configureEach { task ->
            task.sourceCompatibility = JavaVersion.VERSION_17.toString()
            task.targetCompatibility = JavaVersion.VERSION_17.toString()
        }
    }
}
