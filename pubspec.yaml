name: speedygrocer
description: AI-Powered Hyperlocal Grocery Delivery Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.0
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.1.2
  http: ^1.1.2
  intl: ^0.18.1
  fl_chart: ^0.66.2
  lottie: ^3.0.0
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  uuid: ^4.3.3
  speech_to_text: ^7.4.0
  firebase_messaging: ^16.3.0
  safepay_checkout: ^1.0.6

  geocoding: ^4.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/